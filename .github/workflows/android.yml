name: Compilar Mi Dinero Android

on:
  push:
    branches: [main, android-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar contenido web offline
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www/src android/app/src/main/assets/www/icons
          cp index.html styles.css dashboard.css movements.css sections.css manifest.webmanifest sw.js android/app/src/main/assets/www/
          cp src/*.js android/app/src/main/assets/www/src/
          cp icons/icon.svg android/app/src/main/assets/www/icons/
      - name: Validar proyecto Android
        working-directory: android
        run: gradle :app:lintDebug :app:testDebugUnitTest
      - name: Verificar APK sin permiso de Internet
        working-directory: android
        run: |
          gradle :app:assembleDebug
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee /tmp/permisos.txt
          ! grep -q 'android.permission.INTERNET' /tmp/permisos.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging.txt
          grep -q "package: name='com.midinero.personal'" /tmp/badging.txt
          grep -q "application-label:'Mi Dinero'" /tmp/badging.txt
      - name: Validar versión Android
        working-directory: android
        run: |
          grep -q "versionCode='2'" /tmp/badging.txt
          grep -q "versionName='1.0.1'" /tmp/badging.txt
      - name: Preparar APK descargable
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mi-Dinero-Android-1.0.1.apk
      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Dinero-Android-debug
          path: Mi-Dinero-Android-1.0.1.apk
          if-no-files-found: error
      - name: Verificar firma del APK debug
        working-directory: android
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/firma-apk.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/firma-apk.txt
      - name: Publicar descarga permanente
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-v1.0.1 --cleanup-tag -y || true
          gh release create android-v1.0.1 Mi-Dinero-Android-1.0.1.apk --title "Mi Dinero Android 1.0.1" --notes "APK Android 1.0.1 para instalación directa. Compilado y validado automáticamente desde main." --latest

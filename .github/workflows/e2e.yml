name: Probar Mi Dinero en navegador

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Iniciar Mi Dinero
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mi-dinero-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/mi-dinero-http.log
          exit 1
      - name: Probar flujo crítico real
        run: npx playwright test tests/e2e-smoke.spec.js --browser=chromium --reporter=line

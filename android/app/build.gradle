plugins { id 'com.android.application' }

def releaseKeystoreFile = System.getenv('MI_DINERO_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('MI_DINERO_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('MI_DINERO_KEY_ALIAS')
def releaseKeyPassword = System.getenv('MI_DINERO_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.midinero.personal'
    compileSdk 35

    defaultConfig {
        applicationId 'com.midinero.personal'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation(platform('org.jetbrains.kotlin:kotlin-bom:1.8.22'))
}
